# 80shihua.com — Hugo 静态站 Nginx 参考配置（宝塔版）
#
# 宝塔已为每个站点自动生成 vhost（路径类似
#   /www/server/panel/vhost/nginx/www.80shihua.com.conf
# ），无需手动新建 server 块。
#
# 用法：在宝塔面板 → 网站 → www.80shihua.com → 设置 → 配置文件，
# 在自动生成的 server { ... } 内，把下面这几段「补充规则」粘贴进去即可。
# 站点根目录 root 宝塔已设为 /www/wwwroot/www.80shihua.com（即 DEPLOY_PATH）。

    # 静态资源长缓存（图片/css/js 一年，文件名唯一可安全长期缓存）
    location ~* \.(jpg|jpeg|png|gif|webp|svg|css|js|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 开启 gzip 压缩（宝塔默认可能已开，重复无害）
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # 自定义 404（Hugo 已生成 /404.html）
    error_page 404 /404.html;

# 说明：
# - root 已在宝塔建站时设为 /www/wwwroot/www.80shihua.com，与 GitHub Secret DEPLOY_PATH 一致
# - 走 Cloudflare 代理时，HTTPS 由 CF 边缘证书处理，本机无需配 443
# - 若访问出现 403，检查该目录属主是否为部署用户可写（root 部署最省事）
