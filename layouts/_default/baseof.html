<!DOCTYPE html>
<html lang="zh-cn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {{ partial "seo.html" . }}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
  <script>
    // 首屏前应用主题，避免深浅色闪烁（FOUC）
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
      document.documentElement.classList.add("js");
    })();
  </script>
</head>
<body>
  <div class="read-progress" id="read-progress" aria-hidden="true"></div>
  <a class="skip-link" href="#main">跳到主内容</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ .Site.BaseURL }}">
        <span class="brand__mark">梦</span>
        <span class="brand__name">{{ .Site.Title }}</span>
      </a>
      <div class="header-right">
        <nav class="site-nav" aria-label="主导航">
          <a href="{{ .Site.BaseURL }}">首页</a>
          <a href="{{ "categories/" | relURL }}">分类</a>
          <a href="{{ "tags/" | relURL }}">标签</a>
          <a href="{{ "search/" | relURL }}">搜索</a>
          <a href="{{ "about/" | relURL }}">关于</a>
        </nav>
        <button id="theme-toggle" class="theme-toggle" type="button"
                aria-label="切换深色模式" title="切换深色 / 浅色模式">🌙</button>
      </div>
    </div>
  </header>
  <main id="main" class="container">
    {{ block "main" . }}{{ end }}
  </main>
  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-col footer-col--brand">
        <span class="footer-brand"><span class="brand__mark">梦</span>{{ .Site.Title }}</span>
        {{ with .Site.Params.description }}<p class="footer-desc">{{ . }}</p>{{ end }}
      </div>
      <nav class="footer-col" aria-label="页脚导航">
        <h2 class="footer-title">导航</h2>
        <a href="{{ .Site.BaseURL }}">首页</a>
        <a href="{{ "categories/" | relURL }}">分类</a>
        <a href="{{ "tags/" | relURL }}">标签</a>
        <a href="{{ "search/" | relURL }}">站内搜索</a>
        <a href="{{ "about/" | relURL }}">关于我</a>
      </nav>
      <div class="footer-col">
        <h2 class="footer-title">订阅</h2>
        <a href="{{ "index.xml" | relURL }}">RSS 订阅</a>
        <a href="{{ "search/" | relURL }}">全文检索</a>
      </div>
    </div>
    <div class="container footer-bottom">
      <span class="footer-copy">&copy; {{ now.Year }} {{ .Site.Title }}. 由 Hugo 驱动.</span>
    </div>
  </footer>
  <button class="to-top" id="to-top" type="button" aria-label="返回顶部" title="返回顶部">↑</button>
  <script>
    (function () {
      var btn = document.getElementById("theme-toggle");
      function label(t) { btn.textContent = t === "dark" ? "☀️" : "🌙"; }
      label(document.documentElement.getAttribute("data-theme"));
      btn.addEventListener("click", function () {
        var cur = document.documentElement.getAttribute("data-theme");
        var next = cur === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        try { localStorage.setItem("theme", next); } catch (e) {}
        label(next);
      });

      // 返回顶部
      var toTop = document.getElementById("to-top");
      toTop.addEventListener("click", function () {
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      // 滚动：进度条 + 返回顶部显隐
      // 目录：服务端渲染优先；缺失时（如正文标题是原始 HTML）由 JS 从正文补全
      var postLayout = document.querySelector(".post-layout");
      var tocBox = document.querySelector(".post-toc");
      if (tocBox) {
        var nav = tocBox.querySelector(".toc__body");
        var content = document.querySelector(".post-content");
        if (nav && !nav.querySelector("li") && content) {
          var heads = content.querySelectorAll("h2, h3");
          if (heads.length >= 2) {
            var root = document.createElement("ul");
            var curLi = null;
            heads.forEach(function (h, i) {
              if (!h.id) { h.id = "sec-" + (i + 1); }
              var li = document.createElement("li");
              var a = document.createElement("a");
              a.href = "#" + h.id;
              a.textContent = (h.textContent || "").replace(/[\s#]+$/g, "").trim() || h.id;
              li.appendChild(a);
              if (h.tagName === "H2") {
                root.appendChild(li);
                curLi = li;
              } else if (curLi) {
                var sub = curLi.querySelector("ul");
                if (!sub) { sub = document.createElement("ul"); curLi.appendChild(sub); }
                sub.appendChild(li);
              } else {
                root.appendChild(li);
              }
            });
            nav.appendChild(root);
          }
        }
        if (!nav || !nav.querySelector("li")) {
          if (tocBox.parentNode) { tocBox.parentNode.removeChild(tocBox); }
          if (postLayout) { postLayout.classList.remove("has-toc"); }
        } else {
          tocBox.classList.remove("post-toc--auto");
          if (postLayout) { postLayout.classList.add("has-toc"); }
          var det = tocBox.querySelector(".toc");
          if (det) { det.open = window.matchMedia("(min-width: 1180px)").matches; }
        }
      }

      // 目录高亮（scrollspy）
      var spyLinks = [], spyTargets = [];
      var tocEl = document.querySelector(".post-toc");
      if (tocEl) {
        tocEl.querySelectorAll("a[href^='#']").forEach(function (a) {
          var id = decodeURIComponent(a.getAttribute("href").slice(1));
          var el = document.getElementById(id);
          if (el) { spyLinks.push(a); spyTargets.push(el); }
        });
      }
      function spy() {
        if (!spyTargets.length) return;
        var y = (window.scrollY || document.documentElement.scrollTop) + 160;
        var idx = -1;
        for (var i = 0; i < spyTargets.length; i++) {
          if (spyTargets[i].getBoundingClientRect().top + (window.scrollY || 0) <= y) idx = i;
        }
        for (var j = 0; j < spyLinks.length; j++) {
          spyLinks[j].classList.toggle("is-active", j === idx);
        }
      }

      var bar = document.getElementById("read-progress");
      function onScroll() {
        var h = document.documentElement;
        var max = h.scrollHeight - h.clientHeight;
        var pct = max > 0 ? (h.scrollTop || document.body.scrollTop) / max * 100 : 0;
        bar.style.width = pct + "%";
        toTop.classList.toggle("show", (h.scrollTop || document.body.scrollTop) > 600);
        spy();
      }
      window.addEventListener("scroll", onScroll, { passive: true });
      onScroll();

      // 代码块复制按钮
      document.querySelectorAll(".post-content .highlight").forEach(function (block) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "copy-btn";
        btn.textContent = "复制";
        btn.setAttribute("data-pagefind-ignore", "");
        btn.addEventListener("click", function () {
          var src = block.querySelector("pre");
          var text = src ? src.innerText : block.innerText;
          var done = function () {
            btn.textContent = "已复制";
            btn.classList.add("is-copied");
            setTimeout(function () {
              btn.textContent = "复制";
              btn.classList.remove("is-copied");
            }, 1600);
          };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done, function () { btn.textContent = "失败"; });
          } else {
            var ta = document.createElement("textarea");
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand("copy"); done(); } catch (e) { btn.textContent = "失败"; }
            document.body.removeChild(ta);
          }
        });
        block.appendChild(btn);
      });

      // 图片加载完成后淡入（未加载时由骨架屏占位）
      document.querySelectorAll(".card__img, .post-cover img, .rel-card__thumb").forEach(function (img) {
        var ok = function () { img.classList.add("is-loaded"); };
        if (img.complete) { ok(); return; }
        img.addEventListener("load", ok, { once: true });
        img.addEventListener("error", ok, { once: true });
      });

      // 按钮涟漪起点跟随点击位置
      document.addEventListener("pointerdown", function (e) {
        var b = e.target && e.target.closest ? e.target.closest(".btn") : null;
        if (!b) return;
        var r = b.getBoundingClientRect();
        b.style.setProperty("--rx", ((e.clientX - r.left) / r.width * 100) + "%");
        b.style.setProperty("--ry", ((e.clientY - r.top) / r.height * 100) + "%");
      }, { passive: true });

      // 标记当前所在导航项
      var here = location.pathname.replace(/\/+$/, "") || "/";
      document.querySelectorAll(".site-nav a").forEach(function (a) {
        var href = a.getAttribute("href");
        if (!href) return;
        var p;
        try { p = new URL(href, location.href).pathname; } catch (err) { return; }
        p = p.replace(/\/+$/, "") || "/";
        if (p === here || (p !== "/" && here.indexOf(p) === 0)) {
          a.classList.add("is-current");
          a.setAttribute("aria-current", "page");
        }
      });

      // 进场动效
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (!reduce && "IntersectionObserver" in window) {
        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (e) {
            if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
          });
        }, { threshold: 0.08 });
        document.querySelectorAll(".reveal").forEach(function (el) { io.observe(el); });
      } else {
        document.querySelectorAll(".reveal").forEach(function (el) { el.classList.add("in"); });
      }
    })();
  </script>
</body>
</html>
