{{ define "main" }}
<section class="music-page">
  <header class="music-hero">
    <p class="music-kicker">音乐</p>
    <h1 class="music-title">{{ .Title }}</h1>
    {{ with .Params.summary }}<p class="music-sub">{{ . }}</p>{{ end }}
  </header>

  <div class="music-stage">
    <div class="music-card">
      <meting-js
        server="netease"
        type="playlist"
        id="134594689"
        api="https://v.iarc.top/?server=:server&type=:type&id=:id&r=:r"
        theme="#4f46e5"
        list-folded="false"
        list-max-height="360px"
        lrc-type="false"
        preload="metadata"></meting-js>
    </div>
  </div>

  <p class="music-note">
    <span class="music-note__dot" aria-hidden="true"></span>
    <span>网易云音乐 · 梦回故里喜欢的音乐</span>
    <a href="https://music.163.com/playlist?id=134594689" target="_blank" rel="noopener noreferrer">在网易云打开 ↗</a>
  </p>
</section>

<link rel="stylesheet" href="{{ "vendor/aplayer/APlayer.min.css" | relURL }}">
<script src="{{ "vendor/aplayer/APlayer.min.js" | relURL }}"></script>
<script src="{{ "vendor/meting/Meting.min.js" | relURL }}"></script>
{{ end }}
