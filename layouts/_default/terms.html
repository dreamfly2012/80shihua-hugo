{{ define "main" }}
<header class="list-head">
  <p class="list-head__kicker">{{ .Type | humanize }}</p>
  <h1 class="list-head__title">{{ .Title }}</h1>
</header>
<div class="term-grid">
  {{ range .Data.Terms.Alphabetical }}
  <a class="term-card reveal" href="{{ .Page.RelPermalink }}">
    <span class="term-card__name">{{ .Page.Title }}</span>
    <span class="term-card__count">{{ .Count }}</span>
  </a>
  {{ end }}
</div>
{{ end }}
