{{ define "main" }}
<header class="list-head">
  <p class="list-head__kicker">{{ .Type | humanize }}</p>
  <h1 class="list-head__title">{{ .Title }}</h1>
  {{ with .Data.Term }}<p class="list-head__desc">{{ . }}</p>{{ end }}
</header>
<div class="grid">
  {{ range .Paginator.Pages }}
    {{ partial "post-card.html" (dict "page" .) }}
  {{ end }}
</div>
{{ partial "pagination.html" . }}
{{ end }}
